spring.application.name=tss-compare-service
server.port=8080
spring.sql.init.mode=never
spring.lifecycle.timeout-per-shutdown-phase=90s
server.shutdown=graceful
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB
compare.config-import-max-bytes=52428800
# 可把旧 application-datasource/executor/spark.properties 放入外部 config 目录。
spring.config.import=optional:file:./config/application-datasource.properties,optional:file:./config/application-executor.properties,optional:file:./config/application-spark.properties,optional:file:./config/application-local.properties
# 原配置中该logger的debug可能包含完整提交命令。
logging.level.org.apache.spark.launcher=WARN

compare.result.detail-limit=${BD_DIFF_DETAIL_LIMIT:1000}
compare.result.retention-days=${BD_DIFF_RETENTION_DAYS:30}
